<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#556b2f">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="הצוות שלי">
  <meta name="description" content="ניהול נוכחות ותנועות של צוות מילואים">
  <title>הצוות שלי</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <span class="logo" aria-hidden="true">🪖</span>
    <h1 id="unit-name">הצוות שלי</h1>
    <button class="icon-btn" data-act="share" aria-label="שתף סיכום יומי">📤</button>
  </header>

  <main id="view"></main>

  <button id="fab" class="fab" data-act="quick" hidden>➕ <span>יציאה מהירה</span></button>

  <nav class="tabbar" aria-label="ניווט">
    <button data-act="tab" data-tab="today"><span class="ic">🏠</span>היום</button>
    <button data-act="tab" data-tab="week"><span class="ic">📅</span>שבוע</button>
    <button data-act="tab" data-tab="moves"><span class="ic">🚶</span>תנועות<i class="dot" id="pending-dot" hidden></i></button>
    <button data-act="tab" data-tab="soldiers"><span class="ic">🎖️</span>חיילים</button>
    <button data-act="tab" data-tab="settings"><span class="ic">⚙️</span>הגדרות</button>
  </nav>

  <div id="toast" role="status" aria-live="polite"></div>
  <input type="file" id="import-file" accept="application/json,.json" hidden>

  <script src="js/logic.js"></script>
  <script src="js/seed.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
